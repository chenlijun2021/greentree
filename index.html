<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morandi ASCII Soft Grass Field</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0eee9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: transparent; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-color 0.3s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(250, 249, 246, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 340px;
            max-height: 90vh;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease, transform 0.3s ease;
        }

        #ui-content {
            overflow-y: auto;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 8px 0;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #8b9a8b; 
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 3px;
        }
        
        .hidden-element { display: none; }

        #ui-content::-webkit-scrollbar { width: 6px; }
        #ui-content::-webkit-scrollbar-track { background: transparent; }
        #ui-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .ui-collapsed #ui-content { display: none; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="grassCanvas"></canvas>
    </div>

    <!-- Source Image element for fetching color data -->
    <img id="sourceImage" class="hidden-element" crossorigin="anonymous" src="6307f51129dafd0d62f34f41900cd5d6_3.jpg" alt="Source Painting">
    <canvas id="offscreenCanvas" class="hidden-element"></canvas>

    <div id="ui-panel" class="text-gray-800">
        <div class="flex justify-between items-center border-b border-gray-200 pb-3 cursor-pointer select-none" id="ui-header">
            <div>
                <h2 class="text-xl font-bold text-gray-900 tracking-tight">ASCII Grass Field</h2>
                <p class="text-xs text-gray-500 mt-1">Dynamic Depth & Wanderers</p>
            </div>
            <button id="ui-toggle" class="text-gray-500 hover:text-gray-900 text-2xl font-bold p-2 focus:outline-none transition-transform duration-200">
                −
            </button>
        </div>
        
        <div id="ui-content">
            <div class="p-3 bg-gray-50 rounded-lg border border-gray-200 space-y-3">
                <div>
                    <label class="block text-sm font-semibold mb-1">1. Grass Color Pattern</label>
                    <label for="imageUpload" class="flex items-center justify-center w-full px-4 py-1.5 bg-white border border-dashed border-gray-400 rounded cursor-pointer hover:border-[#8b9a8b] hover:bg-gray-50 transition-colors">
                        <span class="text-xs text-gray-600 font-medium">Upload Image Palette</span>
                        <input type="file" id="imageUpload" class="hidden-element" accept="image/*">
                    </label>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">2. Base Background</label>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-gray-600">Color:</span>
                        <input type="color" id="bgColorPicker" value="#f0eee9" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                    </div>
                    <label for="bgUpload" class="flex items-center justify-center w-full px-4 py-1.5 bg-white border border-gray-300 rounded cursor-pointer hover:bg-gray-50 transition-colors shadow-sm">
                        <span class="text-xs text-gray-600 font-medium">Upload BG Image</span>
                        <input type="file" id="bgUpload" class="hidden-element" accept="image/*">
                    </label>
                </div>
            </div>

            <div class="p-3 bg-gradient-to-br from-[#8b9a8b]/10 to-transparent rounded-lg border border-[#8b9a8b]/30">
                <label class="block text-sm font-semibold text-gray-800 mb-2">3. Entities (Press 'W')</label>
                <div class="space-y-2">
                    <!-- Entity 1 -->

                            <input type="file" id="wUpload1" class="hidden-element" accept="image/png, image/jpeg">
                        </label>
                        <div class="flex flex-col w-[60%] gap-1">
                            <div class="flex flex-col">
                                <div class="flex justify-between text-[10px] text-gray-500 font-medium mb-0.5">
                                    <span>Size</span>

                    <!-- Entity 2 -->

                        <label class="flex-1 flex items-center justify-center bg-gray-50 border border-gray-300 rounded cursor-pointer py-1 hover:bg-gray-100 text-[11px] text-center min-h-[50px]">
                            <span id="label-w2" class="text-gray-600 font-medium">Img 2</span>
                            <input type="file" id="wUpload2" class="hidden-element" accept="image/png, image/jpeg">

                        <div class="flex flex-col w-[60%] gap-1">
                            <div class="flex flex-col">

                                    <span>Size</span>
                                    <span id="wSizeVal2" class="font-mono">70px</span>

                    <!-- Entity 3 -->
                    <div class="flex items-center gap-2 bg-white/80 p-1.5 rounded border border-gray-200 shadow-sm">
                        <label class="flex-1 flex items-center justify-center bg-gray-50 border border-gray-300 rounded cursor-pointer py-1 hover:bg-gray-100 text-[11px] text-center min-h-[50px]">
                            <span id="label-w3" class="text-gray-600 font-medium">Img 3</span>
                            <input type="file" id="wUpload3" class="hidden-element" accept="image/png, image/jpeg">

                            <div class="flex flex-col">

                            <div class="flex flex-col">
                                <div class="flex justify-between text-[10px] text-gray-500 font-medium mb-0.5">
                                    <span>Speed</span>

                    <!-- Entity 4 -->
                    <div class="flex items-center gap-2 bg-white/80 p-1.5 rounded border border-gray-200 shadow-sm">
                        <label class="flex-1 flex items-center justify-center bg-gray-50 border border-gray-300 rounded cursor-pointer py-1 hover:bg-gray-100 text-[11px] text-center min-h-[50px]">
                            <span id="label-w4" class="text-gray-600 font-medium">Img 4</span>
                            <input type="file" id="wUpload4" class="hidden-element" accept="image/png, image/jpeg">

                            <div class="flex flex-col">

                                    <span>Size</span>

            <!-- Auto Wind Toggle -->

                <input type="checkbox" id="autoWind" class="w-4 h-4 text-green-600 bg-white border-green-300 rounded cursor-pointer focus:ring-green-500">

            <!-- Hint -->
            <div class="mt-1 p-3 bg-gradient-to-r from-gray-50 to-gray-100 border border-gray-200 rounded-xl text-xs text-center shadow-inner">

                    <kbd class="px-2 py-1 bg-white border border-gray-300 rounded shadow-sm font-mono text-gray-600">SPACE</kbd> Wave

    <script>
        const canvas = document.getElementById('grassCanvas');
        const ctx = canvas.getContext('2d', { alpha: true }); 
        const canvasContainer = document.getElementById('canvas-container');
        
        const sourceImage = document.getElementById('sourceImage');
        const offscreenCanvas = document.getElementById('offscreenCanvas');
        const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

        let colorTable = [];
        let colorMapWidth = 0;
        let colorMapHeight = 0;

        const fontSizeSlider = document.getElementById('fontSize');
        const grassLengthSlider = document.getElementById('grassLength');
        const densitySlider = document.getElementById('density');
        const flexibilitySlider = document.getElementById('flexibility');
        const autoWindCheckbox = document.getElementById('autoWind');
        
        const uiHeader = document.getElementById('ui-header');
        const uiPanel = document.getElementById('ui-panel');
        const uiToggle = document.getElementById('ui-toggle');

        let width, height;
        let blades = [];
        const words = ["M", "o", "r", "a", "n", "d", "i", " ", "A", "r", "t", "W", "i", "n", "d"];

        let activeWindWaves = [];
        let activeWanderers = [];
        
        // Storage for the 4 custom uploaded entities: Image, Size, Speed
        let customWImages = [null, null, null, null];
        let customWSizes = [70, 70, 70, 70];
        let customWSpeeds = [2.0, 2.0, 2.0, 2.0];

        class FixedEntity {
            constructor() {
                this.relX = 0.8; // Default 80% width
                this.relY = 0.3; // Default 30% height
                this.size = 150; // Acts as the base width
                this.img = null;
                this.aspectRatio = 1;
            }
            
            // Physical and visual coordinates
            get x() { return width * this.relX; }
            get y() { return height * this.relY; }
            
            // Physics center and radius for collision/repulsion
            get cx() { return this.x; }
            get cy() { return this.y - (this.size / this.aspectRatio) / 2; }
            get radius() { return Math.max(this.size, this.size / this.aspectRatio) / 2 * 0.9; }
            
            draw(ctx) {
                let drawW = this.size;
                let drawH = this.size / this.aspectRatio;
                
                if (this.img && this.img.complete && this.img.naturalWidth > 0) {
                    ctx.drawImage(this.img, this.x - drawW / 2, this.y - drawH, drawW, drawH);
                } else {
                    // Fallback visual: a minimalist semi-transparent square
                    ctx.fillStyle = 'rgba(250, 249, 246, 0.9)';
                    ctx.fillRect(this.x - drawW / 2, this.y - drawH, drawW, drawH);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#8b9a8b';
                    ctx.strokeRect(this.x - drawW / 2, this.y - drawH, drawW, drawH);
                }
            }
        }
        
        const staticObstacle = new FixedEntity();

        class Wanderer {
            constructor(img, size, idIndex) {
                this.idIndex = idIndex;
                this.size = size;
                // Start securely offscreen left
                this.x = -this.size - (Math.random() * 150);
                // Assign a random starting vertical track
                this.y = Math.random() * (height - 150) + 75;
                
                this.img = img;
                this.active = true;
                
                // Speed multiplier to give some variance even among same-speed settings
                this.speedMult = 0.8 + Math.random() * 0.4;
                this.targetY = this.y;
                this.noiseTime = Math.random() * 1000;
                this.wobbleSpeed = 0.8 + Math.random() * 1.2;
                
                // Floating & gentle rotation physics
                this.swayFreq = 1.2 + Math.random() * 1.0;
                this.swayAmp = 0.04 + Math.random() * 0.05; // Soft sway amplitude
            }
            
            // Physics center and radius for collision/repulsion
            get cx() { return this.x; }
            get cy() { return this.y - this.size / 2; }
            get radius() { return this.size / 2 * 0.95; }

            update() {
                // Apply speed from UI array
                let currentSpeed = customWSpeeds[this.idIndex] * this.speedMult;
                this.x += currentSpeed;
                this.noiseTime += 0.02 * this.wobbleSpeed;

                // Randomly assign a new wandering target Y
                if (Math.random() < 0.015) {
                    this.targetY = this.y + (Math.random() - 0.5) * 350;
                    // Clamp to screen bounds roughly
                    this.targetY = Math.max(this.size, Math.min(height - this.size, this.targetY));
                }

                // Smoothly steer towards target Y
                this.y += (this.targetY - this.y) * 0.018;
                
                // Add an immediate undulating sine wave on top of the steering
                this.y += Math.sin(this.noiseTime * 1.2) * 1.2;

                // Deactivate if far right offscreen
                if (this.x > width + this.size + 100) {
                    this.active = false;
                }
            }

            draw(ctx) {
                // Calculate gentle organic sway angle
                const currentTilt = Math.sin(this.noiseTime * this.swayFreq) * this.swayAmp;

                ctx.save();
                // Move context origin to the center of the entity
                ctx.translate(this.x, this.y - this.size / 2);
                ctx.rotate(currentTilt);

                if (this.img && this.img.complete && this.img.naturalWidth > 0) {
                    ctx.drawImage(this.img, -this.size / 2, -this.size / 2, this.size, this.size);
                } else {
                    // Fallback visual: Minimalist shaded circle
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size / 2);
                    grad.addColorStop(0, '#faf9f6');
                    grad.addColorStop(1, '#c5cfcc');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#8b9a8b';
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        class ASCIIBlade {
            constructor(x, y, maxLength) {
                this.rootX = x;
                this.rootY = y;
                this.length = Math.floor(Math.max(3, maxLength * (0.6 + Math.random() * 0.5)));
                
                this.chars = [];
                for(let i=0; i < this.length; i++) {
                    this.chars.push(words[Math.floor(Math.random() * words.length)]);
                }

                this.currentBend = 0; 
                this.velocity = 0;
                
                this.stiffness = 0.015 + Math.random() * 0.03; 
                this.damping = 0.85 + Math.random() * 0.08; 
                this.basePhase = Math.random() * Math.PI * 2; 
            }

            updatePhysics(ambientWind, waves, allEntities, softnessMultiplier) {
                let forceSum = ambientWind;

                // 1. Calculate Complex Wind Wave Forces
                for (let i = 0; i < waves.length; i++) {
                    let wave = waves[i];
                    let yOffset = (this.rootY - height / 2);
                    // Calculates organic curved wave front
                    let waveFrontX = wave.x + (yOffset * Math.tan(wave.angle)) + (Math.sin(this.rootY * wave.curveFreq) * wave.curveAmp);
                    
                    let dist = this.rootX - waveFrontX;
                    if (dist > -wave.width && dist < wave.width) {
                        let force = (1 - Math.abs(dist) / wave.width) * wave.strength;
                        forceSum += force;
                    }
                }

                // 2. Calculate Entity Repulsion (The "Parting" Effect)
                let repulsion = 0;
                for (let i = 0; i < allEntities.length; i++) {
                    let ent = allEntities[i];
                    let dx = this.rootX - ent.cx;
                    let dy = this.rootY - ent.cy; 
                    
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let influenceRadius = ent.radius + 60; // Base interaction radius
                    
                    if (dist < influenceRadius) {
                        // The closer it is, the harder it pushes
                        let pushForce = (1 - dist / influenceRadius);
                        // Quadratic easing for smoother parting
                        pushForce = pushForce * pushForce * 180; 
                        
                        // Push away relative to position (right or left)
                        repulsion += (dx > 0 ? pushForce : -pushForce);
                    }
                }

                // Spring Integration for Smooth Bending
                let targetBend = (forceSum + repulsion) * softnessMultiplier;
                let acceleration = (targetBend - this.currentBend) * this.stiffness;
                this.velocity += acceleration;
                this.velocity *= this.damping; 
                this.currentBend += this.velocity;
            }

            draw(ctx, fontSize) {
                const charSpacing = fontSize * 0.75; 
                
                for (let i = 0; i < this.length; i++) {
                    const progress = i / this.length;
                    // Quadratic bend curve
                    const horizontalOffset = this.currentBend * (progress * progress);
                    
                    const charX = this.rootX + horizontalOffset;
                    const charY = this.rootY - (i * charSpacing);

                    if (charY > height + fontSize || charY < -fontSize) continue;
                    
                    // True ASCII mapping: Sample color exactly where character visually exists right now
                    ctx.fillStyle = getFastColorAt(charX, charY);
                    ctx.fillText(this.chars[i], charX, charY);
                }
            }
        }

        // UI Collapsible Logic
        let isUiOpen = true;
        uiHeader.addEventListener('click', () => {
            isUiOpen = !isUiOpen;
            if (isUiOpen) {
                uiPanel.classList.remove('ui-collapsed');
                uiToggle.textContent = '−';
            } else {
                uiPanel.classList.add('ui-collapsed');
                uiToggle.textContent = '+';
            }
        });

        // Setup File Uploaders for Background & Colors
        document.getElementById('bgColorPicker').addEventListener('input', (e) => {
            canvasContainer.style.backgroundColor = e.target.value;
        });

        document.getElementById('bgUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => canvasContainer.style.backgroundImage = `url(${event.target.result})`;
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('imageUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    sourceImage.onload = processImage;
                    sourceImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (colorTable.length > 0) initField();
        }
        window.addEventListener('resize', resizeCanvas);

        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
        }

        function generateFallbackPattern() {
            width = window.innerWidth;
            height = window.innerHeight;
            colorMapWidth = 50;
            colorMapHeight = 50;
            colorTable = new Array(50 * 50);
            for(let i=0; i<colorTable.length; i++) {
                const x = i % 50;
                const y = Math.floor(i / 50);
                colorTable[i] = ((Math.floor(x/5) + Math.floor(y/5)) % 2 === 0) ? "#a3ac9e" : "#5d6356";
            }
            resizeCanvas();
        }

        function processImage() {
            try {
                if (!sourceImage.complete || sourceImage.naturalWidth === 0) {
                    throw new Error("Image not fully loaded or invalid.");
                }
                
                const maxDimension = 600; 
                let imgW = sourceImage.naturalWidth;
                let imgH = sourceImage.naturalHeight;
                
                if (imgW > maxDimension || imgH > maxDimension) {
                    const ratio = Math.min(maxDimension / imgW, maxDimension / imgH);
                    imgW = Math.floor(imgW * ratio);
                    imgH = Math.floor(imgH * ratio);
                }

                colorMapWidth = imgW;
                colorMapHeight = imgH;
                
                offscreenCanvas.width = imgW;
                offscreenCanvas.height = imgH;
                
                offscreenCtx.drawImage(sourceImage, 0, 0, imgW, imgH);
                const imgData = offscreenCtx.getImageData(0, 0, imgW, imgH).data;
                colorTable = new Array(imgW * imgH);
                
                for (let i = 0; i < imgData.length; i += 4) {
                    colorTable[i / 4] = rgbToHex(imgData[i], imgData[i + 1], imgData[i + 2]);
                }
                resizeCanvas(); 
            } catch (error) {
                console.warn("Canvas processing failed (possibly CORS or load timing). Fallback pattern activated.", error);
                generateFallbackPattern();
            }
        }

        function getFastColorAt(screenX, screenY) {
            if (colorTable.length === 0) return "#888888"; 
            let mx = Math.floor((screenX / width) * colorMapWidth);
            let my = Math.floor((screenY / height) * colorMapHeight);
            mx = Math.max(0, Math.min(colorMapWidth - 1, mx));
            my = Math.max(0, Math.min(colorMapHeight - 1, my));
            return colorTable[my * colorMapWidth + mx];
        }

        function initField() {
            blades = [];
            const fontSize = parseInt(fontSizeSlider.value);
            const maxLength = parseInt(grassLengthSlider.value);
            const densityValue = parseInt(densitySlider.value);
            
            const stepX = Math.max(fontSize * 0.3, (200 / densityValue) * (fontSize * 0.4));
            const stepY = Math.max(fontSize * 0.8, (200 / densityValue) * (maxLength * fontSize * 0.1));

            for (let y = -50; y < height + (maxLength * fontSize) + 50; y += stepY) {
                for (let x = -100; x < width + 100; x += stepX) {
                    const jitterX = (Math.random() - 0.5) * stepX * 1.5;
                    const jitterY = (Math.random() - 0.5) * stepY;
                    blades.push(new ASCIIBlade(x + jitterX, y + jitterY, maxLength));
                }
            }
            
            // Crucial: Sort strictly by rootY so 2.5D depth interleaving works perfectly
            blades.sort((a, b) => a.rootY - b.rootY);
        }

        function updateUILabel(id, val) { document.getElementById(id).textContent = val; }

        fontSizeSlider.addEventListener('input', (e) => {
            updateUILabel('fontSizeVal', e.target.value + 'px');
            initField();
        });
        grassLengthSlider.addEventListener('input', (e) => {
            updateUILabel('grassLengthVal', e.target.value + ' chars');
            initField();
        });
        densitySlider.addEventListener('input', (e) => {
            updateUILabel('densityVal', e.target.value + '%');
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(initField, 100);
        });
        flexibilitySlider.addEventListener('input', (e) => {
            let label = "Low";
            if(e.target.value > 33) label = "Medium";
            if(e.target.value > 66) label = "High";
            updateUILabel('flexibilityVal', label);
        });

        // Setup File Uploaders for the 4 Entities
        [1, 2, 3, 4].forEach(num => {
            // Upload Logic
            document.getElementById(`wUpload${num}`).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            customWImages[num - 1] = img;
                            document.getElementById(`label-w${num}`).innerHTML = `<span class="text-green-600 font-bold">Img ${num} ✓</span>`;
                        }
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Size Logic
            const sizeSlider = document.getElementById(`wSize${num}`);
            if (sizeSlider) {
                sizeSlider.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    customWSizes[num - 1] = val;
                    document.getElementById(`wSizeVal${num}`).textContent = val + 'px';
                });
            }
            
            // Speed Logic
            const speedSlider = document.getElementById(`wSpeed${num}`);
            if (speedSlider) {
                speedSlider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    customWSpeeds[num - 1] = val;
                    document.getElementById(`wSpeedVal${num}`).textContent = val.toFixed(1);
                });
            }
        });

        const fixedObjSizeSlider = document.getElementById('fixedObjSize');
        const fixedObjXSlider = document.getElementById('fixedObjX');
        const fixedObjYSlider = document.getElementById('fixedObjY');
        const fixedObjUpload = document.getElementById('fixedObjUpload');

        fixedObjSizeSlider.addEventListener('input', (e) => {
            updateUILabel('fixedObjSizeVal', e.target.value + 'px');
            staticObstacle.size = parseInt(e.target.value);
        });
        
        fixedObjXSlider.addEventListener('input', (e) => {
            updateUILabel('fixedObjXVal', e.target.value + '%');
            staticObstacle.relX = parseInt(e.target.value) / 100;
        });
        
        fixedObjYSlider.addEventListener('input', (e) => {
            updateUILabel('fixedObjYVal', e.target.value + '%');
            staticObstacle.relY = parseInt(e.target.value) / 100;
        });
        
        fixedObjUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        staticObstacle.img = img;
                        // Calculate Aspect Ratio to maintain native proportions
                        staticObstacle.aspectRatio = img.naturalWidth / img.naturalHeight;
                        document.getElementById('label-fixed-obj').innerHTML = `<span class="text-green-600 font-bold">Image Loaded ✓</span>`;
                    }
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Interactions (Space = Wind, W = Wanderers)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); 
                activeWindWaves.push({
                    x: -800,
                    speed: width / (60 + Math.random() * 40), 
                    strength: 300 + Math.random() * 400, 
                    width: 250 + Math.random() * 350, 
                    angle: (Math.random() - 0.5) * 1.5, // Sharper organic curves
                    curveFreq: 0.003 + Math.random() * 0.005, 
                    curveAmp: 150 + Math.random() * 300 
                });
            } else if (e.code === 'KeyW' || e.key === 'w' || e.key === 'W') {
                // Spawn exactly 4 entities with their own individual sizes and speeds
                for(let i = 0; i < 4; i++) {
                    activeWanderers.push(new Wanderer(customWImages[i], customWSizes[i], i));
                }
            }
        });

        // Function to prevent entities from passing through each other
        function resolveCollisions(wanderers, fixedObj) {
            const iterations = 2; // For stability
            for (let iter = 0; iter < iterations; iter++) {
                // 1. Wanderer vs Wanderer
                for (let i = 0; i < wanderers.length; i++) {
                    for (let j = i + 1; j < wanderers.length; j++) {
                        let w1 = wanderers[i];
                        let w2 = wanderers[j];
                        let dx = w2.cx - w1.cx;
                        let dy = w2.cy - w1.cy;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        let minDist = w1.radius + w2.radius;

                        if (dist < minDist && dist > 0.001) {
                            let overlap = minDist - dist;
                            let nx = dx / dist;
                            let ny = dy / dist;

                            let totalSize = w1.size + w2.size;
                            let w1Ratio = w2.size / totalSize;
                            let w2Ratio = w1.size / totalSize;

                            w1.x -= nx * overlap * w1Ratio;
                            w1.y -= ny * overlap * w1Ratio;
                            w2.x += nx * overlap * w2Ratio;
                            w2.y += ny * overlap * w2Ratio;
                            
                            w1.targetY -= ny * overlap * w1Ratio;
                            w2.targetY += ny * overlap * w2Ratio;
                        }
                    }
                }

                // 2. Wanderer vs Fixed Object
                for (let i = 0; i < wanderers.length; i++) {
                    let w = wanderers[i];
                    let dx = fixedObj.cx - w.cx;
                    let dy = fixedObj.cy - w.cy;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let minDist = w.radius + fixedObj.radius;

                    if (dist < minDist && dist > 0.001) {
                        let overlap = minDist - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;

                        // Only wanderer is pushed away (FixedObj is immovable)
                        w.x -= nx * overlap;
                        w.y -= ny * overlap;
                        w.targetY -= ny * overlap;
                    }
                }
            }
        }

        function animate(time) {
            ctx.clearRect(0, 0, width, height);
            
            const fontSize = parseInt(fontSizeSlider.value);
            const softness = parseInt(flexibilitySlider.value) / 30; 
            
            ctx.font = `bold ${fontSize}px "Segoe UI", Arial, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const globalTime = time * 0.001;
            const baseAmbientWind = Math.sin(globalTime * 0.5) * 8;

            // Manage Wind Waves
            // Auto Wind Generator
            if (autoWindCheckbox.checked && Math.random() < 0.005) { // Occasional random breeze
                 activeWindWaves.push({
                    x: -800,
                    speed: width / (60 + Math.random() * 40), 
                    strength: 200 + Math.random() * 200, 
                    width: 250 + Math.random() * 250, 
                    angle: (Math.random() - 0.5) * 1.5, 
                    curveFreq: 0.003 + Math.random() * 0.005, 
                    curveAmp: 150 + Math.random() * 300 
                });
            }
            
            for (let i = activeWindWaves.length - 1; i >= 0; i--) {
                let wave = activeWindWaves[i];
                wave.x += wave.speed;
                if (wave.x > width + Math.abs(wave.curveAmp) + 800) {
                    activeWindWaves.splice(i, 1);
                }
            }

            // Manage and Sort Wanderers
            activeWanderers.forEach(w => w.update());
            
            // Resolve overlaps so they don't clip through each other
            resolveCollisions(activeWanderers, staticObstacle);
            
            activeWanderers = activeWanderers.filter(w => w.active);
            
            // Combine Wanderers with the Fixed Obstacle into one array for depth sorting
            let allEntities = [...activeWanderers, staticObstacle];
            allEntities.sort((a, b) => a.y - b.y);

            // 2.5D Depth Rendering: Interleave Grass and Entities based on their exact Y altitude
            let eIndex = 0;

            for (let i = 0; i < blades.length; i++) {
                const blade = blades[i];

                // If the next lowest entity is vertically "behind" this grass blade, draw the entity first!
                while (eIndex < allEntities.length && allEntities[eIndex].y <= blade.rootY) {
                    allEntities[eIndex].draw(ctx);
                    eIndex++;
                }

                const ambient = baseAmbientWind * Math.sin(globalTime * 1.2 + blade.basePhase);
                // Provide allEntities so grass can calculate repulsion around them
                blade.updatePhysics(ambient, activeWindWaves, allEntities, softness);
                blade.draw(ctx, fontSize);
            }

            // Draw any remaining entities that are entirely in front of all grass
            while (eIndex < allEntities.length) {
                allEntities[eIndex].draw(ctx);
                eIndex++;
            }

            requestAnimationFrame(animate);
        }

        // Boot Application
        if (sourceImage.complete) {
            processImage();
        } else {
            sourceImage.onload = processImage;
            sourceImage.onerror = generateFallbackPattern;
        }
        
        requestAnimationFrame(animate);

    </script>
