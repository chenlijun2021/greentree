<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Weeping Willow Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f4;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
        /* Custom scrollbar for control panel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="ui-panel" class="absolute top-4 right-4 w-80 bg-white/90 backdrop-blur-md shadow-lg rounded-xl border border-gray-100 p-5 z-10 transition-transform duration-300 transform translate-x-0">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-bold text-gray-800 tracking-wide uppercase">Simulation Controls</h2>
            <button id="toggle-ui" class="text-gray-400 hover:text-gray-700 focus:outline-none" title="Close Panel">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="space-y-4 max-h-[78vh] overflow-y-auto pr-2">
            <!-- Background Color -->
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Background Color</label>
                <div class="flex items-center gap-3">
                    <input type="color" id="bg-color" value="#f4f7f4" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                    <span class="text-xs text-gray-500 font-mono uppercase" id="bg-val">#f4f7f4</span>
                </div>
            </div>

            <!-- Leaf Color -->
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Leaf (Char) Color</label>
                <div class="flex items-center gap-3">
                    <input type="color" id="char-color" value="#5b8c5a" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                    <span class="text-xs text-gray-500 font-mono uppercase" id="char-val">#5b8c5a</span>
                </div>
            </div>

            <!-- Stem Color -->
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Branch Line Color</label>
                <div class="flex items-center gap-3">
                    <input type="color" id="stem-color" value="#88aa86" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                    <span class="text-xs text-gray-500 font-mono uppercase" id="stem-val">#88aa86</span>
                </div>
            </div>

            <!-- Stem Thickness -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Line Thickness (粗细)</span>
                    <span id="thick-val" class="text-gray-400">0.8</span>
                </label>
                <input type="range" id="stem-width" min="0.2" max="3.0" step="0.1" value="0.8" class="w-full accent-green-600">
            </div>

            <!-- Stem Opacity -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Line Opacity (透明度)</span>
                    <span id="alpha-val" class="text-gray-400">0.45</span>
                </label>
                <input type="range" id="stem-alpha" min="0.05" max="1.0" step="0.05" value="0.45" class="w-full accent-green-600">
            </div>

            <!-- Wheat Wave Wind Mode Switch -->
            <div class="flex items-center justify-between py-1 border-y border-gray-100 my-2">
                <div>
                    <span class="block text-xs font-medium text-gray-700">Wheat Wave Mode (麦浪风)</span>
                    <span class="text-[10px] text-gray-400">Localized ripple gusts sweeping across canopy</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="wheat-wave-toggle" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-600"></div>
                </label>
            </div>

            <!-- Retain Leaves -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Retain Leaves (剩余柳叶)</span>
                    <span id="retain-val" class="text-gray-400">15%</span>
                </label>
                <input type="range" id="retain-leaves" min="0" max="100" value="15" class="w-full accent-green-600">
            </div>

            <!-- Leaf Size -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Leaf Size</span>
                    <span id="size-val" class="text-gray-400">14</span>
                </label>
                <input type="range" id="char-size" min="8" max="32" value="14" class="w-full accent-green-600">
            </div>

            <!-- Branch Length -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Branch Length</span>
                    <span id="length-val" class="text-gray-400">75</span>
                </label>
                <input type="range" id="branch-length" min="20" max="250" value="75" class="w-full accent-green-600">
            </div>

            <!-- Branch Count -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Branch Count</span>
                    <span id="density-val" class="text-gray-400">100</span>
                </label>
                <input type="range" id="density" min="30" max="250" value="100" class="w-full accent-green-600">
            </div>

            <!-- Cluster Variation -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Cluster Variation</span>
                    <span id="cluster-val" class="text-gray-400">70</span>
                </label>
                <input type="range" id="cluster-var" min="0" max="100" value="70" class="w-full accent-green-600">
            </div>

            <!-- Wind Force -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Wind Force</span>
                    <span id="wind-val" class="text-gray-400">35</span>
                </label>
                <input type="range" id="wind-force" min="0" max="150" value="35" class="w-full accent-blue-500">
            </div>

            <!-- Fall Rate -->
            <div>
                <label class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                    <span>Fall Rate</span>
                    <span id="rate-val" class="text-gray-400">1.0</span>
                </label>
                <input type="range" id="fall-rate" min="0.1" max="5.0" step="0.1" value="1.0" class="w-full accent-blue-500">
            </div>
            
            <div class="pt-3 border-t border-gray-100">
                <p class="text-[11px] text-gray-500 leading-tight mb-3 bg-gray-50 p-2 rounded">
                    <strong>D</strong> - Trigger waterfall shedding<br>
                    <strong>Space</strong> - Stop top stream & drain waterfall
                </p>
                <button id="reset-btn" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-medium py-1.5 px-4 rounded-lg transition-colors border border-red-200 text-sm shadow-sm">
                    Reset defaults
                </button>
            </div>
        </div>
    </div>

    <button id="open-ui" class="hidden absolute top-4 right-4 bg-white/90 backdrop-blur-md shadow-md rounded-lg p-2 border border-gray-200 text-gray-600 hover:text-gray-900 z-0 transition-opacity">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>

    <script>
        const defaultConfig = {
            bgColor: '#f4f7f4',
            charColor: '#5b8c5a',
            stemColor: '#88aa86',
            stemWidth: 0.8,
            stemOpacity: 0.45,
            wheatWave: false,
            charSize: 14,
            branchLength: 75,
            density: 100,
            clustering: 70,
            windForce: 35,
            fallRate: 1.0,
            retainLeaves: 15
        };
        let config = { ...defaultConfig };

        let branches = [];
        let particles = [];
        let isWaterfall = false;
        let isFadingOut = false;
        let simTime = 0;
        
        let pg; // Offscreen trail layer
        let letterSprites = {}; 
        const chars = "abcdefghijklmnopqrstuvwxyz";

        const uiBindings = [
            { inputId: 'bg-color', valId: 'bg-val', key: 'bgColor', parse: null },
            { inputId: 'char-color', valId: 'char-val', key: 'charColor', parse: null },
            { inputId: 'stem-color', valId: 'stem-val', key: 'stemColor', parse: null },
            { inputId: 'stem-width', valId: 'thick-val', key: 'stemWidth', parse: parseFloat },
            { inputId: 'stem-alpha', valId: 'alpha-val', key: 'stemOpacity', parse: parseFloat },
            { inputId: 'char-size', valId: 'size-val', key: 'charSize', parse: parseInt },
            { inputId: 'branch-length', valId: 'length-val', key: 'branchLength', parse: parseInt },
            { inputId: 'density', valId: 'density-val', key: 'density', parse: parseInt },
            { inputId: 'cluster-var', valId: 'cluster-val', key: 'clustering', parse: parseInt },
            { inputId: 'wind-force', valId: 'wind-val', key: 'windForce', parse: parseInt },
            { inputId: 'fall-rate', valId: 'rate-val', key: 'fallRate', parse: parseFloat },
            { inputId: 'retain-leaves', valId: 'retain-val', key: 'retainLeaves', parse: parseInt, suffix: '%' }
        ];

        uiBindings.forEach(binding => {
            const inputEl = document.getElementById(binding.inputId);
            const valEl = document.getElementById(binding.valId);
            
            if (inputEl && valEl) {
                inputEl.addEventListener('input', (e) => {
                    let val = binding.parse ? binding.parse(e.target.value) : e.target.value;
                    valEl.innerText = binding.suffix ? val + binding.suffix : val;
                    config[binding.key] = val;

                    if (binding.key === 'bgColor') {
                        document.body.style.backgroundColor = config.bgColor;
                    }
                    if (binding.key === 'charColor' || binding.key === 'charSize') {
                        generateLetterSprites();
                    }
                    if (binding.key === 'branchLength' || binding.key === 'density' || binding.key === 'clustering') {
                        generateBranches();
                    }
                });
            }
        });

        const wheatToggle = document.getElementById('wheat-wave-toggle');
        if (wheatToggle) {
            wheatToggle.addEventListener('change', (e) => {
                config.wheatWave = e.target.checked;
            });
        }

        document.getElementById('toggle-ui').addEventListener('click', () => {
            document.getElementById('ui-panel').classList.add('translate-x-[120%]');
            setTimeout(() => document.getElementById('open-ui').classList.remove('hidden'), 300);
        });

        document.getElementById('open-ui').addEventListener('click', () => {
            document.getElementById('ui-panel').classList.remove('translate-x-[120%]');
            document.getElementById('open-ui').classList.add('hidden');
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            Object.assign(config, defaultConfig);
            
            uiBindings.forEach(binding => {
                const inputEl = document.getElementById(binding.inputId);
                const valEl = document.getElementById(binding.valId);
                if (inputEl && valEl) {
                    inputEl.value = config[binding.key];
                    valEl.innerText = binding.suffix ? config[binding.key] + binding.suffix : config[binding.key];
                }
            });
            if (wheatToggle) wheatToggle.checked = defaultConfig.wheatWave;
            document.body.style.backgroundColor = config.bgColor;
            
            isWaterfall = false;
            isFadingOut = false;
            particles = [];
            if (pg) pg.clear();
            generateLetterSprites();
            generateBranches();
        });

        function generateLetterSprites() {
            letterSprites = {};
            const spriteSize = Math.max(32, config.charSize * 2); 
            
            for (let i = 0; i < chars.length; i++) {
                let char = chars[i];
                let g = createGraphics(spriteSize, spriteSize);
                g.pixelDensity(1);
                g.textAlign(CENTER, CENTER);
                g.textSize(config.charSize);
                g.fill(config.charColor);
                g.noStroke();
                g.text(char, spriteSize / 2, spriteSize / 2);
                letterSprites[char] = g;
            }
        }

        class WillowBranch {
            constructor(x) {
                this.rootX = x;
                this.noiseOffset = random(1000);
                this.numSegments = floor(config.branchLength * random(0.85, 1.25));
                this.segmentLength = 5.5;
                this.segments = [];
                this.leaves = [];
                
                this.isDetaching = false;
                this.currentDetachSeg = 0; 
                
                this.generateLeaves();
            }

            generateLeaves() {
                this.leaves = [];
                for (let i = 3; i < this.numSegments; i++) {
                    let densityN = noise(this.rootX * 0.1, i * 0.2);
                    let leafCount = 1; 
                    
                    if (densityN > 0.6) leafCount = floor(random(3, 5));
                    else if (densityN > 0.3) leafCount = floor(random(1, 3));

                    for (let j = 0; j < leafCount; j++) {
                        let side = random() > 0.5 ? 1 : -1;
                        this.leaves.push({
                            segIdx: i,
                            char: chars.charAt(floor(random(chars.length))),
                            offsetX: side * random(4, 12),
                            offsetY: random(-4, 4),
                            angle: random(-PI / 4, PI / 4),
                            scaleMod: random(0.6, 1.2),
                            retentionValue: random(100)
                        });
                    }
                }
            }

            startDetaching() {
                this.isDetaching = true;
                this.currentDetachSeg = this.numSegments;
            }

            updateAndDraw(t, wForce, ctxParam) {
                let ctx = ctxParam || (typeof drawingContext !== 'undefined' ? drawingContext : null);
                if (!ctx || typeof ctx.beginPath !== 'function') return;

                let currentX = this.rootX;
                let currentY = 0; 
                this.segments = [{x: currentX, y: currentY}];
                
                let globalSway = noise(t * 0.005) * 2 - 1; 

                for (let i = 1; i < this.numSegments; i++) {
                    let depthRatio = i / this.numSegments;
                    let angle = HALF_PI; 
                    
                    if (config.wheatWave) {
                        let waveSpeed = t * 0.04;
                        let spatialWave1 = Math.sin(this.rootX * 0.015 - waveSpeed) * 0.5;
                        let spatialWave2 = Math.cos(this.rootX * 0.035 + waveSpeed * 1.3 + noise(this.rootX * 0.02) * 4.0) * 0.35;
                        // Map the raw pulse to range [0.3, 1.0] to prevent the wind from ever completely stopping (0.0)
                        let rawPulse = Math.sin(this.rootX * 0.006 + waveSpeed * 0.6);
                        let wavePulse = 0.3 + 0.7 * Math.pow((rawPulse + 1) / 2, 1.5);
                        let gust = (noise(this.rootX * 0.008, t * 0.012) * 2 - 1) * 0.6;
                        let totalWind = (spatialWave1 + spatialWave2 + gust) * wavePulse * (wForce * 0.0075) * 1.4;
                        angle += totalWind * Math.pow(depthRatio, 1.35);
                    } else {
                        if (wForce > 0) {
                            let windNoise = noise(this.noiseOffset, i * 0.05, t * 0.01) * 2 - 1;
                            let deflection = (windNoise + globalSway * 0.5) * (wForce * 0.01) * Math.pow(depthRatio, 1.2);
                            angle += deflection;
                        }
                    }
                    
                    currentX += Math.cos(angle) * this.segmentLength;
                    currentY += Math.sin(angle) * this.segmentLength;
                    this.segments.push({x: currentX, y: currentY});
                }

                if (this.isDetaching) {
                    if (this.currentDetachSeg > 0) {
                        this.currentDetachSeg -= 0.85 * config.fallRate;
                        
                        for (let i = this.leaves.length - 1; i >= 0; i--) {
                            let leaf = this.leaves[i];
                            if (leaf.segIdx > this.currentDetachSeg) {
                                // If retention randomly generated value is larger than the slider setting, drop it
                                if (leaf.retentionValue >= config.retainLeaves) {
                                    let p = this.segments[leaf.segIdx];
                                    if (p) {
                                        particles.push({
                                            x: p.x + leaf.offsetX,
                                            y: p.y + leaf.offsetY,
                                            g: 0,
                                            s: config.charSize * leaf.scaleMod,
                                            char: leaf.char,
                                            angle: leaf.angle
                                        });
                                    }
                                    this.leaves.splice(i, 1); 
                                }
                            }
                        }
                    } else if (!isFadingOut) {
                        particles.push({
                            x: this.rootX + random(-15, 15),
                            y: random(-20, 0),
                            g: 0,
                            s: config.charSize * random(0.7, 1.2),
                            char: chars.charAt(floor(random(chars.length))),
                            angle: random(-PI / 4, PI / 4)
                        });
                    }
                }

                // Render stem line with configurable thickness and opacity
                if (this.segments.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.segments[0].x, this.segments[0].y);
                    for (let k = 1; k < this.segments.length; k++) {
                        ctx.lineTo(this.segments[k].x, this.segments[k].y);
                    }
                    ctx.strokeStyle = config.stemColor;
                    ctx.lineWidth = config.stemWidth;
                    ctx.globalAlpha = config.stemOpacity;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }

                // Render attached leaves
                for (let leaf of this.leaves) {
                    let p = this.segments[leaf.segIdx];
                    if (p) {
                        let sprite = letterSprites[leaf.char];
                        if (sprite && sprite.canvas) {
                            let drawSize = config.charSize * leaf.scaleMod;
                            ctx.save();
                            ctx.translate(p.x + leaf.offsetX, p.y + leaf.offsetY);
                            if (leaf.angle) ctx.rotate(leaf.angle);
                            ctx.drawImage(sprite.canvas, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
                            ctx.restore();
                        }
                    }
                }
            }
        }

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.style('display', 'block');
            document.body.style.backgroundColor = config.bgColor;
            
            pg = createGraphics(windowWidth, windowHeight); 
            imageMode(CENTER);
            
            generateLetterSprites();
            generateBranches();
        }

        function generateBranches() {
            branches = [];
            let targetCount = floor((width / 14) * (config.density / 100));
            
            for (let i = 0; i < targetCount; i++) {
                let normI = i / Math.max(1, targetCount - 1);
                let posX;
                
                if (config.clustering > 0) {
                    let clusterNoise = noise(normI * (config.clustering * 0.08) + 12.3);
                    let nonLinearX = (normI * 0.65 + clusterNoise * 0.35);
                    posX = constrain(nonLinearX * width + random(-15, 15), 15, width - 15);
                } else {
                    posX = (width / targetCount) * i + random(-15, 15);
                }
                
                branches.push(new WillowBranch(posX));
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            if (pg) pg.resizeCanvas(windowWidth, windowHeight);
            generateBranches(); 
        }

        function draw() {
            simTime++;
            background(config.bgColor);

            // Handle waterfall particles on the offscreen trail buffer
            if (isWaterfall && pg && pg.drawingContext) {
                let pctx = pg.drawingContext;

                pctx.globalCompositeOperation = 'destination-out';
                pctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; 
                pctx.fillRect(0, 0, pg.width, pg.height);
                pctx.globalCompositeOperation = 'source-over';

                // High-performance O(1) particle removal loop
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.s *= 0.998; 
                    
                    let N = noise(p.x / width, p.y / 9, simTime / width);

                    // Fluid Perlin movement logic
                    if (N > 0.4) {
                        p.x += 0;
                        p.g += 0.5 * config.fallRate; 
                        p.y += p.g; 
                    } else {
                        if (N % 0.1 > 0.05) { p.x += 1.5 * config.fallRate; } 
                        else { p.x -= 1.5 * config.fallRate; } 
                        p.g = 0;
                        p.y += 0.5 * config.fallRate; 
                    }

                    let sprite = letterSprites[p.char];
                    if (sprite && sprite.canvas) {
                        let alpha = Math.max(0.05, p.s / config.charSize);
                        pctx.save();
                        pctx.globalAlpha = alpha;
                        pctx.translate(p.x, p.y);
                        if (p.angle) pctx.rotate(p.angle);
                        pctx.drawImage(sprite.canvas, -p.s / 2, -p.s / 2, p.s, p.s);
                        pctx.restore();
                    }

                    // Garbage collect off-screen particles
                    if (p.y > height + 50 || p.s < 1) {
                        particles.splice(i, 1);
                    }
                }
                
                imageMode(CORNER);
                image(pg, 0, 0);
                imageMode(CENTER);
            }

            // Render crisp tree branches and leaves onto the main canvas
            let mainCtx = typeof drawingContext !== 'undefined' ? drawingContext : null;
            if (mainCtx) {
                for (let b of branches) {
                    b.updateAndDraw(simTime, config.windForce, mainCtx);
                }
            }
        }

        function keyPressed() {
            if (key === 'd' || key === 'D') {
                if (isWaterfall) {
                    isWaterfall = false;
                    isFadingOut = false;
                    particles = [];
                    if (pg) pg.clear();
                    generateBranches();
                } else {
                    isWaterfall = true;
                    isFadingOut = false;
                    if (pg) pg.clear();
                    for (let b of branches) {
                        b.startDetaching();
                    }
                }
            } else if (keyCode === 32) { 
                if (isWaterfall) {
                    isFadingOut = true; 
                }
            }
        }
    </script>
</body>
</html>
